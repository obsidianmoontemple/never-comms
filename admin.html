<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Never Line - World Bible Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap');
  
  html, body { 
    margin: 0; padding: 0; 
    background: #0a0e0b; color: #ece7d6; 
    font-family: 'Space Mono', monospace; 
    height: 100vh; display: flex; flex-direction: column;
  }
  
  .header {
    background: #1a1f17; padding: 15px 25px; border-bottom: 2px solid #b5651d;
    display: flex; justify-content: space-between; align-items: center;
  }
  .header h1 { margin: 0; font-size: 18px; color: #e8a33d; letter-spacing: 0.1em; }
  .status { font-size: 12px; color: #948e7a; }
  
  .container {
    display: flex; flex: 1; overflow: hidden;
  }
  
  .sidebar {
    width: 250px; background: #12160e; border-right: 1px solid #262c22;
    padding: 20px; overflow-y: auto;
  }
  .sidebar h2 { font-size: 14px; color: #948e7a; margin-top: 0; border-bottom: 1px solid #262c22; padding-bottom: 10px; }
  
  .doc-btn {
    display: block; width: 100%; text-align: left; background: transparent;
    border: 1px solid transparent; color: #ece7d6; font-family: inherit;
    padding: 10px; margin-bottom: 5px; cursor: pointer; border-radius: 4px;
  }
  .doc-btn:hover { background: #1a1f17; }
  .doc-btn.active { background: #262c22; border-color: #b5651d; color: #e8a33d; }
  
  .editor {
    flex: 1; display: flex; flex-direction: column; padding: 20px;
  }
  
  .editor-header {
    display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;
  }
  .editor-header h3 { margin: 0; color: #e8a33d; font-size: 16px; text-transform: uppercase; }
  
  textarea {
    flex: 1; background: #12160e; color: #ece7d6; border: 1px solid #262c22;
    border-radius: 4px; padding: 15px; font-family: inherit; font-size: 13px;
    line-height: 1.6; resize: none; outline: none; margin-bottom: 15px;
  }
  textarea:focus { border-color: #b5651d; }
  
  button.save-btn {
    background: #b5651d; color: #1a1006; border: none; padding: 12px 24px;
    font-family: inherit; font-weight: bold; cursor: pointer; border-radius: 4px;
    align-self: flex-end; transition: background 0.2s;
  }
  button.save-btn:hover { background: #e8a33d; }
  button.save-btn:disabled { opacity: 0.5; cursor: not-allowed; }

</style>
</head>
<body>

<div class="header">
  <h1>NEVER WORLD // BIBLE ADMIN</h1>
  <div class="status" id="sysStatus">Connecting to Supabase Relay...</div>
</div>

<div class="container">
  <div class="sidebar">
    <h2>DATA RECORDS</h2>
    <button class="save-btn" style="width:100%; margin-bottom: 15px; background: #4a5c3f; color: #ece7d6;" onclick="createNewRecord()">+ NEW RECORD</button>
    <div id="fileList">Loading files...</div>
  </div>
  
  <div class="editor">
    <div class="editor-header">
      <h3 id="currentFile">SELECT A RECORD</h3>
    </div>
    <textarea id="editorArea" disabled placeholder="Select a record from the sidebar to view and edit its contents..."></textarea>
    <button class="save-btn" id="saveBtn" disabled>SAVE CHANGES</button>
  </div>
</div>

<script>
  const RELAY_URL = 'https://script.google.com/macros/s/AKfycbwVY-GKC4yZiyskJ0fcxRU6VCkPOMFxFpXDbfoOW1R4xfUQbdF_XN086E3GyvuidwZB/exec';

  let loreData = {};
  let currentKey = null;

  const fileList = document.getElementById('fileList');
  const editorArea = document.getElementById('editorArea');
  const currentFileLbl = document.getElementById('currentFile');
  const saveBtn = document.getElementById('saveBtn');
  const sysStatus = document.getElementById('sysStatus');

  async function loadAllLore() {
    try {
      const res = await fetch(RELAY_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'get_all_lore' })
      });
      const data = await res.json();
      
      if (data.error) throw new Error(data.error);
      
      loreData = {};
      data.lore.forEach(item => { loreData[item.key] = item.content; });
      renderSidebar();
      sysStatus.textContent = 'SYSTEM ONLINE';
    } catch (e) {
      sysStatus.textContent = 'ERROR: ' + e.message;
      sysStatus.style.color = '#c1443a';
    }
  }

  function renderSidebar() {
    fileList.innerHTML = '';
    Object.keys(loreData).forEach(key => {
      const btn = document.createElement('button');
      btn.className = 'doc-btn';
      btn.textContent = key.toUpperCase();
      btn.onclick = () => selectFile(key, btn);
      fileList.appendChild(btn);
    });
  }

  function selectFile(key, btnNode) {
    currentKey = key;
    document.querySelectorAll('.doc-btn').forEach(b => b.classList.remove('active'));
    btnNode.classList.add('active');
    
    currentFileLbl.textContent = 'EDITING: ' + key;
    editorArea.value = loreData[key];
    editorArea.disabled = false;
    saveBtn.disabled = false;
  }

  function createNewRecord() {
    const key = prompt("Enter a simple ID for this record (e.g., timeline, char_hook):");
    if (!key || key.trim() === '') return;
    
    const safeKey = key.trim().toLowerCase().replace(/[^a-z0-9_]/g, '_');
    
    if (loreData[safeKey]) {
      alert("That record already exists!");
      return;
    }
    
    loreData[safeKey] = "// Start typing character info or timeline events here. Hit SAVE CHANGES to push to the database.";
    renderSidebar();
    
    const btns = document.querySelectorAll('.doc-btn');
    if(btns.length > 0) {
        btns[btns.length - 1].click();
    }
  }

  saveBtn.onclick = async () => {
    if (!currentKey) return;
    
    const newContent = editorArea.value;
    saveBtn.disabled = true;
    sysStatus.textContent = 'SAVING TO SUPABASE...';
    sysStatus.style.color = '#e8a33d';

    try {
      const res = await fetch(RELAY_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ 
          action: 'update_lore',
          key: currentKey,
          content: newContent
        })
      });
      
      const data = await res.json();
      if (data.error) throw new Error(data.error);

      loreData[currentKey] = newContent; 
      sysStatus.textContent = 'SAVE COMPLETE';
      sysStatus.style.color = '#948e7a';
    } catch (e) {
      sysStatus.textContent = 'SAVE FAILED: ' + e.message;
      sysStatus.style.color = '#c1443a';
    } finally {
      saveBtn.disabled = false;
    }
  };

  loadAllLore();
</script>

</body>
</html>
