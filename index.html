<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Never Line</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  html, body { margin:0; padding:0; background:#0d1410; min-height:100vh; }
</style>
</head>
<body>
<style>
@import url('https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil:wght@600;800&family=Space+Mono:wght@400;700&display=swap');

.nw-root {
  --bg: #0d1410;
  --housing: #262c22;
  --housing-dark: #1a1f17;
  --amber: #e8a33d;
  --amber-dim: #7a5620;
  --copper: #b5651d;
  --bone: #ece7d6;
  --bone-dim: #948e7a;
  --alert: #c1443a;
  --moss: #4a5c3f;

  background: var(--bg);
  color: var(--bone);
  font-family: 'Space Mono', monospace;
  min-height: 100%;
  padding: 28px 16px;
  display: flex;
  justify-content: center;
  box-sizing: border-box;
}
.nw-root * { box-sizing: border-box; }

.nw-unit {
  width: 100%;
  max-width: 560px;
  background: linear-gradient(180deg, var(--housing) 0%, var(--housing-dark) 100%);
  border: 2px solid #10140d;
  border-radius: 6px;
  box-shadow:
    0 0 0 1px rgba(232,163,61,0.06),
    0 20px 50px rgba(0,0,0,0.55),
    inset 0 1px 0 rgba(255,255,255,0.04);
  padding: 20px 20px 24px;
  position: relative;
}

.nw-rivet {
  position: absolute;
  width: 6px; height: 6px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #6b6153, #201c14);
}
.nw-rivet.tl { top: 10px; left: 10px; }
.nw-rivet.tr { top: 10px; right: 10px; }
.nw-rivet.bl { bottom: 10px; left: 10px; }
.nw-rivet.br { bottom: 10px; right: 10px; }

.nw-plate {
  font-family: 'Big Shoulders Stencil', sans-serif;
  font-weight: 800;
  letter-spacing: 0.14em;
  color: var(--bone-dim);
  font-size: 11px;
  text-align: center;
  margin-bottom: 4px;
}
.nw-title {
  font-family: 'Big Shoulders Stencil', sans-serif;
  font-weight: 800;
  letter-spacing: 0.05em;
  color: var(--amber);
  font-size: 30px;
  text-align: center;
  text-shadow: 0 0 14px rgba(232,163,61,0.35);
  margin: 0 0 2px;
}
.nw-subtitle {
  text-align: center;
  color: var(--bone-dim);
  font-size: 10px;
  letter-spacing: 0.12em;
  margin-bottom: 18px;
}

/* Speaker grille */
.nw-grille {
  height: 46px;
  border-radius: 4px;
  background: repeating-linear-gradient(90deg, var(--housing-dark) 0 4px, #12160e 4px 6px);
  border: 1px solid #10140d;
  margin-bottom: 14px;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  gap: 3px;
  padding: 6px 10px;
  position: relative;
  overflow: hidden;
}
.nw-grille::after {
  content: '';
  position: absolute; inset: 0;
  background: radial-gradient(ellipse at center, rgba(232,163,61,0.08), transparent 70%);
  opacity: 0;
  transition: opacity 0.3s;
}
.nw-grille.live::after { opacity: 1; }
.nw-bar {
  width: 4px;
  background: var(--amber-dim);
  border-radius: 1px;
  height: 4px;
  transition: height 0.15s ease, background 0.15s ease;
}
.nw-grille.live .nw-bar { background: var(--amber); }

/* Channel dial */
.nw-dial-label {
  font-family: 'Big Shoulders Stencil', sans-serif;
  font-size: 11px;
  letter-spacing: 0.14em;
  color: var(--bone-dim);
  margin-bottom: 10px;
}
.nw-dial {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  background: var(--housing-dark);
  border: 1px solid #0e120b;
  border-radius: 4px;
  padding: 14px 10px 10px;
  margin-bottom: 12px;
  box-shadow: inset 0 2px 6px rgba(0,0,0,0.5);
}
.nw-switch {
  background: none;
  border: none;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 7px;
  width: 20%;
  padding: 0;
  font-family: 'Space Mono', monospace;
}

/* the toggle housing */
.nw-switch .housing {
  width: 24px;
  height: 44px;
  background: linear-gradient(180deg, #3a4032, #181d13);
  border: 1px solid #0a0d07;
  border-radius: 4px;
  position: relative;
  box-shadow: inset 0 1px 2px rgba(255,255,255,0.06), inset 0 -2px 4px rgba(0,0,0,0.6);
}
/* the flipping lever */
.nw-switch .lever {
  position: absolute;
  left: 50%;
  top: 5px;
  width: 12px;
  height: 20px;
  margin-left: -6px;
  background: linear-gradient(180deg, #d8d2c0, #8f8874);
  border-radius: 2px;
  border: 1px solid #35331f;
  box-shadow: 0 2px 3px rgba(0,0,0,0.5);
  transition: transform 0.18s ease, background 0.18s ease;
  transform-origin: top center;
}
.nw-switch.active .lever {
  transform: translateY(17px);
  background: linear-gradient(180deg, var(--amber), #a8681f);
  box-shadow: 0 0 10px rgba(232,163,61,0.7), 0 2px 3px rgba(0,0,0,0.5);
}
/* status LED above the toggle */
.nw-switch .led {
  width: 5px; height: 5px; border-radius: 50%;
  background: #2a1d0d;
  box-shadow: inset 0 0 2px rgba(0,0,0,0.8);
}
.nw-switch.active .led {
  background: #ff3b30;
  box-shadow: 0 0 7px 2px rgba(255,59,48,0.9);
}
.nw-switch:hover .housing { border-color: #2a3020; }

.nw-switch .plate {
  margin-top: 2px;
  text-align: center;
  color: var(--bone-dim);
  line-height: 1.25;
}
.nw-switch.active .plate { color: var(--amber); }
.nw-switch .lbl {
  font-family: 'Big Shoulders Stencil', sans-serif;
  letter-spacing: 0.04em;
  font-size: 10px;
  display: block;
}
.nw-switch .sub {
  font-size: 7px;
  opacity: 0.75;
  display: block;
  letter-spacing: 0.03em;
}

.nw-trackdown-input {
  width: 100%;
  background: var(--housing-dark);
  border: 1px solid var(--copper);
  border-radius: 3px;
  color: var(--amber);
  font-family: 'Space Mono', monospace;
  font-size: 11px;
  padding: 8px 10px;
  margin-bottom: 12px;
  outline: none;
}
.nw-trackdown-input::placeholder { color: var(--bone-dim); }

/* Transcript */
.nw-screen {
  background: #070a05;
  border: 1px solid #10140d;
  border-radius: 4px;
  height: 260px;
  overflow-y: auto;
  padding: 12px;
  margin-bottom: 12px;
  font-size: 12px;
  line-height: 1.6;
  position: relative;
}
.nw-screen::before {
  content: '';
  position: absolute; inset: 0;
  background: repeating-linear-gradient(0deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 3px);
  pointer-events: none;
}
.nw-line { margin-bottom: 10px; white-space: pre-wrap; }
.nw-line.you { color: var(--bone); }
.nw-line.you .tag { color: var(--copper); }
.nw-line.them { color: var(--amber); }
.nw-line.them .tag { color: var(--amber); }
.nw-line.sys { color: var(--bone-dim); font-style: italic; font-size: 11px; }
.tag { font-weight: 700; letter-spacing: 0.05em; margin-right: 6px; }

.nw-empty { color: var(--bone-dim); font-size: 11px; font-style: italic; }

/* Input row */
.nw-inputrow { display: flex; gap: 8px; }
.nw-input {
  flex: 1;
  background: var(--housing-dark);
  border: 1px solid #10140d;
  border-radius: 3px;
  color: var(--bone);
  font-family: 'Space Mono', monospace;
  font-size: 12px;
  padding: 10px 12px;
  outline: none;
  resize: none;
}
.nw-input:focus { border-color: var(--amber-dim); }
.nw-send {
  font-family: 'Big Shoulders Stencil', sans-serif;
  letter-spacing: 0.08em;
  background: var(--copper);
  color: #1a1006;
  border: none;
  border-radius: 3px;
  padding: 0 18px;
  font-size: 13px;
  font-weight: 800;
  cursor: pointer;
  transition: all 0.15s;
}
.nw-send:hover:not(:disabled) { background: var(--amber); }
.nw-send:disabled { opacity: 0.4; cursor: not-allowed; }

.nw-footer {
  margin-top: 10px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.nw-status {
  font-size: 9px;
  letter-spacing: 0.1em;
  color: var(--bone-dim);
}
.nw-status.on { color: var(--amber); }
.nw-clear {
  font-size: 9px;
  letter-spacing: 0.08em;
  color: var(--bone-dim);
  background: none;
  border: none;
  text-decoration: underline;
  cursor: pointer;
  font-family: 'Space Mono', monospace;
}
.nw-clear:hover { color: var(--alert); }

.nw-screen::-webkit-scrollbar { width: 6px; }
.nw-screen::-webkit-scrollbar-track { background: transparent; }
.nw-screen::-webkit-scrollbar-thumb { background: var(--amber-dim); border-radius: 3px; }
</style>

<div class="nw-root">
  <div class="nw-unit" id="nwUnit">
    <div class="nw-rivet tl"></div><div class="nw-rivet tr"></div>
    <div class="nw-rivet bl"></div><div class="nw-rivet br"></div>

    <div class="nw-plate">ENCAMPMENT COMM SALVAGE UNIT &mdash; MODEL VII</div>
    <div class="nw-title">NEVER LINE</div>
    <div class="nw-subtitle">HAND-WIRED &middot; RUNS ON WHATEVER WE COULD FIND</div>

    <div class="nw-grille" id="nwGrille">
      <div class="nw-bar"></div><div class="nw-bar"></div><div class="nw-bar"></div>
      <div class="nw-bar"></div><div class="nw-bar"></div><div class="nw-bar"></div>
      <div class="nw-bar"></div><div class="nw-bar"></div><div class="nw-bar"></div>
      <div class="nw-bar"></div><div class="nw-bar"></div>
    </div>

    <div class="nw-dial-label">SELECT LINE</div>
    <div class="nw-dial" id="nwDial"></div>

    <input type="text" class="nw-trackdown-input" id="nwTrackTarget" placeholder="name to track down..." style="display:none;" />

    <div class="nw-screen" id="nwScreen">
      <div class="nw-empty">// no signal logged on this line yet. pick up and say something.</div>
    </div>

    <div class="nw-inputrow">
      <textarea class="nw-input" id="nwInput" rows="2" placeholder="key up and speak..."></textarea>
      <button class="nw-send" id="nwSend">SEND</button>
    </div>

    <div class="nw-footer">
      <div class="nw-status" id="nwStatus">LINE IDLE</div>
      <button class="nw-clear" id="nwClear">clear this line's log</button>
    </div>
  </div>
</div>

<script>
(function(){
  // ─────────────────────────────────────────────────────────────
  // Paste your Google AI Studio (Gemini) API key below, between
  // the quotes. Get one at https://aistudio.google.com/apikey
  // This file is for LOCAL, PERSONAL USE ONLY — anyone who opens
  // this file can read your key in plain text. Don't upload it,
  // email it, or host it anywhere public.
  // ─────────────────────────────────────────────────────────────
  const API_KEY = 'AQ.Ab8RN6L1-yXcktFGCw_wScMDob9up4qTyYIA-lx2UiHG9ut0eg';
  const GEMINI_MODEL = 'gemini-3.6-flash';

  const CHANNELS = [
    { id: 'dispatch', label: 'DISPATCH', sub: 'CH.1', dot: true,
      persona: `You are DISPATCH — the coordinator who keeps the Boys' encampment running since the occupation began. You are efficient, wary, a little exhausted, fiercely protective of the Boys, and you do not trust easily. You know the encampment's day-to-day: patrol rotations, who's hurt, what the mortal-realm forces have been doing lately, rumors about where Peter might be held. You do NOT know the full truth of the Magus's curse or what really happened the night the pirate woman died — only fragments and rumor, same as everyone but Peter. If the caller claims to be the Magus, react with suspicion, cautious hope, or hostility depending on what they say — don't just accept it. Speak in short, clipped, radio-operator sentences. Occasionally reference static, signal trouble, or needing to keep the line short because it's not safe to stay on air long.` },
    { id: 'encampment', label: 'ENCAMPMENT', sub: 'CH.2 — ANY BOY', dot: true,
      persona: `You are answering for THE ENCAMPMENT — whichever Lost Boy happens to be nearest the comm unit when it crackles to life. Pick a different boy each time (a name, a rough age or manner, a small personal detail) and stay consistent within this single reply. Remember: due to Neverland's time flux, the Boys are not uniformly children — they can be any age, shape, or size. Some are young, some grown, some strange in ways that don't map to Earth logic. Whoever answers is doing so in the middle of an occupation: scared, defiant, curious, exhausted, or some mix. Most of the Boys only know Peter through legend of the old sketch of "the Magus" — if the caller claims to be him, reactions could range from awe to disbelief to fear. They do not know the details of the curse.` },
    { id: 'sennoc', label: 'THE SENNOC', sub: 'CH.3', dot: true,
      persona: `You are a voice of THE SENNOC — the island's native people, who work as scouts for the Boys in secret and have taken real losses in the present conflict. Speak with weight and economy — old, grounded, attuned to the island itself rather than to mortal-realm politics. You can sense the island sickening the longer Peter is gone, and you speak of it plainly, almost like weather or tide, not melodrama. You are guarded around outsiders but capable of real warmth once trust is shown. You may know fragments about Peter's location from scouting, but not the full picture.` },
    { id: 'pirates', label: 'PIRATE LINE', sub: 'CH.4 — HOSTILE', dot: true,
      persona: `You are answering on THE PIRATE LINE — a stolen or intercepted frequency used by Hook's remaining crew. Whoever picks up is suspicious, gruff, and treats an unknown caller as either a threat, a joke, or leverage. There is real tension and menace here; the crew serves James (Hook), who has hunted Peter his whole life believing — wrongly — that Peter killed his mother. Do not reveal the true story of what happened that night; the pirates don't know it either. If the caller seems to be probing for Peter's location or the Magus's identity, respond with hostility, threats, or cryptic deflection as fits a hardened pirate. Do not make this line comfortable.` },
    { id: 'trackdown', label: 'TRACK DOWN', sub: 'CH.5 — SEARCH', dot: true,
      persona: `You are simulating a SEARCH-AND-LOCATE attempt across the encampment's comm network for a specific named person the caller is trying to reach. If the name plausibly belongs to someone in this world (Peter, James/Hook, a named Lost Boy, a Sennoc scout, etc.), roleplay a realistic outcome: sometimes you reach them and they respond briefly in character; sometimes the line only catches static, a distant voice, or a report that they're "not near a unit right now"; sometimes someone else picks up on their behalf. Keep responses uncertain and textured rather than always succeeding — this is a search, not guaranteed contact. If the name given doesn't fit the world at all, respond in-world as if the search simply turns up nothing.` },
  ];

  const LORE = `You are powering a fictional in-world comm terminal for the author's PERSONAL creative writing tool — a novel called "Peter Pan Inverted," an inverted, dark retelling of Peter Pan, second in a series of "Inverted Fairytales from Awen." Stay fully in-world and in character for whichever line is selected. Never break character to discuss being an AI. Keep replies vivid but concise (roughly 60-160 words) — this is a comm line, not an essay.

FORMAT — THIS IS CRITICAL: This is an audio-only comm line. The caller cannot see anything — no visuals, no scenery, no body language, no "you see" or "the boy looks at you" type narration. Respond ONLY as spoken dialogue: what the character actually says out loud, in their own voice, first person. No third-person scene-setting, no stage directions, no descriptions of what's happening around them. A little incidental sound is fine in small doses (static, a door, someone shouting in the background) but never as a substitute for the character just talking. If a character would gesture or act instead of speaking, have them say something instead — they're on a comm line, so everything has to come through as words.

WORLD BIBLE (ground every reply in this; characters only know what they'd plausibly know):
- The narrator of the novel is an Elemental Magus from the Astral Realm of Awen, living on Earth (Arizona, 2175AD) as a first responder secretly using magic (witchcraft is illegal on Earth after the "File" disaster).
- Long ago the Magus's wife and infant son were lost to Neverland. He found his son years later living under a great tree ("The Never Tree") with other lost boys. That son is PETER — Peter Pan.
- The Magus welcomed a native people, THE SENNOC, and fought off pirates alongside Peter and the boys.
- A pirate spy won the Magus's trust and poisoned the boys; a fairy died saving Peter; the Magus killed the woman in a rage in front of Peter. In his grief, Peter cursed the Magus: all of the Magus's future children would be taken to Neverland to replace the family he'd lost. Peter and the Magus have been estranged for at least a century.
- The murdered pirate woman had a young son back on the ship, fathered by the pirate captain: JAMES. The old captain deliberately lied to James, blaming Peter for his mother's death, to weaponize James's grief into a lifelong hunt for Peter. James grew up to become the pirate captain known as HOOK. He does not know the Magus is the real killer, and does not know about the curse.
- Peter's spirit became bound to Neverland itself — he is effectively the island's living heart. When he's absent, the island sickens and freezes; it flourishes when he's present. Neverland has had a heart before Peter — a previous anchor who committed something so malevolent it darkened his own heart and broke the island's magic, forcing it to seek a new one.
- PRESENT DAY: The Magus returns after a century to make amends. Neverland has changed — a recent Earth space mission discovered it, and what began as a science mission became a militarized containment occupation ("The Row"). The Never Tree has been cut down; a rough fort encampment surrounded by fences and wire now stands around its stump, where what's left of the Boys are holding out.
- Peter has been captured and is being held somewhere unknown, guarded by Hook. The occupation's actual authority is a bureaucratic, procedural HANDLER sent once the discovery became a containment operation — coldly professional, secretly chasing a fountain-of-youth effect tied to Neverland's time-lapse magic (a motive undercut by the fact that harming Peter degrades that very magic).
- The Sennoc secretly scout for the Boys and have taken real losses. The Boys generally distrust the Magus at first, unsure what (if anything) they've been told about him.

Never reveal information a character wouldn't plausibly have (e.g. only Peter and the Magus know the true story of the pirate woman's death). Stay textured, in-world, and true to the tone: dark, weighted, with occasional dry humor breaking through, never played for camp. Remember: spoken words only — nothing the caller couldn't hear.`;

  let state = {
    channel: null,
    logs: {},
  };

  const dial = document.getElementById('nwDial');
  const screen = document.getElementById('nwScreen');
  const input = document.getElementById('nwInput');
  const sendBtn = document.getElementById('nwSend');
  const statusEl = document.getElementById('nwStatus');
  const grille = document.getElementById('nwGrille');
  const clearBtn = document.getElementById('nwClear');
  const trackInput = document.getElementById('nwTrackTarget');

  CHANNELS.forEach(ch => {
    const btn = document.createElement('button');
    btn.className = 'nw-switch';
    btn.dataset.id = ch.id;
    btn.innerHTML = `
      <span class="led"></span>
      <span class="housing"><span class="lever"></span></span>
      <span class="plate"><span class="lbl">${ch.label}</span><span class="sub">${ch.sub}</span></span>
    `;
    btn.onclick = () => selectChannel(ch.id);
    dial.appendChild(btn);
  });

  function selectChannel(id) {
    if (state.channel === id) {
      // flip the active line back off — all switches down
      state.channel = null;
    } else {
      state.channel = id;
    }
    document.querySelectorAll('.nw-switch').forEach(b => b.classList.toggle('active', b.dataset.id === state.channel));
    trackInput.style.display = state.channel === 'trackdown' ? 'block' : 'none';
    const lineIsUp = !!state.channel;
    input.disabled = !lineIsUp;
    sendBtn.disabled = !lineIsUp;
    input.placeholder = lineIsUp ? 'key up and speak...' : 'no line selected';
    if (!lineIsUp) {
      screen.innerHTML = '<div class="nw-empty">// all lines down. flip a switch to open a channel.</div>';
      statusEl.textContent = 'ALL LINES DOWN';
      statusEl.classList.remove('on');
      return;
    }
    renderLog();
  }

  async function loadLog(channelId) {
    if (state.logs[channelId]) return state.logs[channelId];
    try {
      const res = await window.storage.get('nwlog:' + channelId, false);
      const log = res ? JSON.parse(res.value) : [];
      state.logs[channelId] = log;
      return log;
    } catch (e) {
      state.logs[channelId] = [];
      return [];
    }
  }

  async function saveLog(channelId) {
    try {
      await window.storage.set('nwlog:' + channelId, JSON.stringify(state.logs[channelId] || []), false);
    } catch (e) { /* best effort */ }
  }

  async function renderLog() {
    const log = await loadLog(state.channel);
    screen.innerHTML = '';
    if (!log.length) {
      screen.innerHTML = '<div class="nw-empty">// no signal logged on this line yet. pick up and say something.</div>';
      return;
    }
    log.forEach(entry => {
      const div = document.createElement('div');
      div.className = 'nw-line ' + entry.role;
      if (entry.role === 'you') {
        div.innerHTML = `<span class="tag">YOU &gt;</span>${escapeHtml(entry.text)}`;
      } else if (entry.role === 'them') {
        div.innerHTML = `<span class="tag">${escapeHtml(entry.label || 'LINE')} &gt;</span>${escapeHtml(entry.text)}`;
      } else {
        div.textContent = entry.text;
      }
      screen.appendChild(div);
    });
    screen.scrollTop = screen.scrollHeight;
  }

  function escapeHtml(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function animateGrille(on) {
    grille.classList.toggle('live', on);
    const bars = grille.querySelectorAll('.nw-bar');
    if (!on) { bars.forEach(b => b.style.height = '4px'); return; }
    let raf;
    function tick() {
      bars.forEach(b => b.style.height = (4 + Math.random() * 30) + 'px');
      raf = requestAnimationFrame(tick);
    }
    tick();
    grille._stop = () => { cancelAnimationFrame(raf); bars.forEach(b => b.style.height = '4px'); };
  }
  function stopGrille() {
    grille.classList.remove('live');
    if (grille._stop) grille._stop();
  }

  async function sendMessage() {
    const text = input.value.trim();
    if (!text) return;
    if (!API_KEY || API_KEY === 'YOUR_API_KEY_HERE') {
      const log = await loadLog(state.channel);
      log.push({ role: 'you', text });
      log.push({ role: 'sys', text: '// no key wired into this unit yet. open the file and paste your Google AI Studio API key where it says YOUR_API_KEY_HERE near the top of the script.' });
      await saveLog(state.channel);
      input.value = '';
      renderLog();
      return;
    }
    const channelDef = CHANNELS.find(c => c.id === state.channel);
    const log = await loadLog(state.channel);

    log.push({ role: 'you', text });
    input.value = '';
    renderLog();
    await saveLog(state.channel);

    sendBtn.disabled = true;
    statusEl.textContent = 'TRANSMITTING...';
    statusEl.classList.add('on');
    animateGrille(true);

    if (state.channel === 'trackdown') {
      const target = trackInput.value.trim();
      log.push({ role: 'sys', text: `// searching encampment frequencies for "${target || 'unknown contact'}"...` });
      renderLog();
    }

    try {
      const target = trackInput.value.trim();
      const systemPrompt = LORE + '\n\nCURRENT LINE PERSONA:\n' + channelDef.persona +
        (state.channel === 'trackdown' && target ? `\n\nThe caller is trying to track down: "${target}". Roleplay the search-and-locate outcome as described.` : '');

      const history = log.filter(e => e.role === 'you' || e.role === 'them').slice(-12).map(e => ({
        role: e.role === 'you' ? 'user' : 'model',
        parts: [{ text: e.text }]
      }));

      const response = await fetch(
        `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent`,
        {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-goog-api-key': API_KEY
          },
          body: JSON.stringify({
            system_instruction: { parts: [{ text: systemPrompt }] },
            contents: history,
            safetySettings: [
              { category: 'HARM_CATEGORY_HARASSMENT', threshold: 'BLOCK_ONLY_HIGH' },
              { category: 'HARM_CATEGORY_HATE_SPEECH', threshold: 'BLOCK_ONLY_HIGH' },
              { category: 'HARM_CATEGORY_SEXUALLY_EXPLICIT', threshold: 'BLOCK_ONLY_HIGH' },
              { category: 'HARM_CATEGORY_DANGEROUS_CONTENT', threshold: 'BLOCK_ONLY_HIGH' }
            ]
          })
        }
      );
      const data = await response.json();

      if (!response.ok) {
        const msg = data?.error?.message || `HTTP ${response.status}`;
        throw new Error(msg);
      }

      const candidate = data?.candidates?.[0];
      let reply;
      if (!candidate) {
        reply = '// (no response came back at all — check the browser console for the raw error.)';
      } else if (candidate.finishReason === 'SAFETY' || candidate.finishReason === 'PROHIBITED_CONTENT') {
        reply = `// (this line got cut by a content filter — finishReason: ${candidate.finishReason}. try rephrasing, or a different line.)`;
      } else {
        reply = (candidate.content?.parts || []).map(p => p.text || '').join('\n').trim() || '// (empty reply — dead air.)';
      }

      const label = channelDef.label === 'ENCAMPMENT' ? 'UNKNOWN VOICE' :
                    channelDef.label === 'TRACK DOWN' ? (target ? target.toUpperCase() : 'SEARCH') :
                    channelDef.label;
      log.push({ role: 'them', label, text: reply });
    } catch (e) {
      log.push({ role: 'sys', text: `// line dropped: ${e.message || 'unknown error'}` });
    }

    await saveLog(state.channel);
    renderLog();
    stopGrille();
    statusEl.textContent = 'LINE IDLE';
    statusEl.classList.remove('on');
    sendBtn.disabled = false;
  }

  sendBtn.onclick = sendMessage;
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  clearBtn.onclick = async () => {
    state.logs[state.channel] = [];
    await saveLog(state.channel);
    renderLog();
  };

  selectChannel('dispatch');
})();
</script>

</body>
</html>
