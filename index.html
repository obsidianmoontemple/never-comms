<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Never Line</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  html, body { margin:0; padding:0; background:#0d1410; min-height:100vh; }
</style>
</head>
<body>
<style>
@import url('https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil:wght@600;800&family=Space+Mono:wght@400;700&display=swap');

.nw-root {
  --bg: #0d1410;
  --housing: #262c22;
  --housing-dark: #1a1f17;
  --amber: #e8a33d;
  --amber-dim: #7a5620;
  --copper: #b5651d;
  --bone: #ece7d6;
  --bone-dim: #948e7a;
  --alert: #c1443a;
  --moss: #4a5c3f;

  background: var(--bg);
  color: var(--bone);
  font-family: 'Space Mono', monospace;
  min-height: 100%;
  padding: 28px 16px;
  display: flex;
  justify-content: center;
  box-sizing: border-box;
}
.nw-root * { box-sizing: border-box; }

.nw-unit {
  width: 100%;
  max-width: 560px;
  background: linear-gradient(180deg, var(--housing) 0%, var(--housing-dark) 100%);
  border: 2px solid #10140d;
  border-radius: 6px;
  box-shadow:
    0 0 0 1px rgba(232,163,61,0.06),
    0 20px 50px rgba(0,0,0,0.55),
    inset 0 1px 0 rgba(255,255,255,0.04);
  padding: 20px 20px 24px;
  position: relative;
}

.nw-rivet {
  position: absolute;
  width: 6px; height: 6px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #6b6153, #201c14);
}
.nw-rivet.tl { top: 10px; left: 10px; }
.nw-rivet.tr { top: 10px; right: 10px; }
.nw-rivet.bl { bottom: 10px; left: 10px; }
.nw-rivet.br { bottom: 10px; right: 10px; }

.nw-plate {
  font-family: 'Big Shoulders Stencil', sans-serif;
  font-weight: 800;
  letter-spacing: 0.14em;
  color: var(--bone-dim);
  font-size: 11px;
  text-align: center;
  margin-bottom: 4px;
}
.nw-title {
  font-family: 'Big Shoulders Stencil', sans-serif;
  font-weight: 800;
  letter-spacing: 0.05em;
  color: var(--amber);
  font-size: 30px;
  text-align: center;
  text-shadow: 0 0 14px rgba(232,163,61,0.35);
  margin: 0 0 2px;
}
.nw-subtitle {
  text-align: center;
  color: var(--bone-dim);
  font-size: 10px;
  letter-spacing: 0.12em;
  margin-bottom: 18px;
}

/* Speaker grille */
.nw-grille {
  height: 46px;
  border-radius: 4px;
  background: repeating-linear-gradient(90deg, var(--housing-dark) 0 4px, #12160e 4px 6px);
  border: 1px solid #10140d;
  margin-bottom: 14px;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  gap: 3px;
  padding: 6px 10px;
  position: relative;
  overflow: hidden;
}
.nw-grille::after {
  content: '';
  position: absolute; inset: 0;
  background: radial-gradient(ellipse at center, rgba(232,163,61,0.08), transparent 70%);
  opacity: 0;
  transition: opacity 0.3s;
}
.nw-grille.live::after { opacity: 1; }
.nw-bar {
  width: 4px;
  background: var(--amber-dim);
  border-radius: 1px;
  height: 4px;
  transition: height 0.15s ease, background 0.15s ease;
}
.nw-grille.live .nw-bar { background: var(--amber); }

/* Channel dial */
.nw-dial-label {
  font-family: 'Big Shoulders Stencil', sans-serif;
  font-size: 11px;
  letter-spacing: 0.14em;
  color: var(--bone-dim);
  margin-bottom: 10px;
}
.nw-dial {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  background: var(--housing-dark);
  border: 1px solid #0e120b;
  border-radius: 4px;
  padding: 14px 10px 10px;
  margin-bottom: 12px;
  box-shadow: inset 0 2px 6px rgba(0,0,0,0.5);
}
.nw-switch {
  background: none;
  border: none;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 7px;
  width: 20%;
  padding: 0;
  font-family: 'Space Mono', monospace;
}

/* the toggle housing */
.nw-switch .housing {
  width: 24px;
  height: 44px;
  background: linear-gradient(180deg, #3a4032, #181d13);
  border: 1px solid #0a0d07;
  border-radius: 4px;
  position: relative;
  box-shadow: inset 0 1px 2px rgba(255,255,255,0.06), inset 0 -2px 4px rgba(0,0,0,0.6);
}
/* the flipping lever */
.nw-switch .lever {
  position: absolute;
  left: 50%;
  top: 5px;
  width: 12px;
  height: 20px;
  margin-left: -6px;
  background: linear-gradient(180deg, #d8d2c0, #8f8874);
  border-radius: 2px;
  border: 1px solid #35331f;
  box-shadow: 0 2px 3px rgba(0,0,0,0.5);
  transition: transform 0.18s ease, background 0.18s ease;
  transform-origin: top center;
}
.nw-switch.active .lever {
  transform: translateY(17px);
  background: linear-gradient(180deg, var(--amber), #a8681f);
  box-shadow: 0 0 10px rgba(232,163,61,0.7), 0 2px 3px rgba(0,0,0,0.5);
}
/* status LED above the toggle */
.nw-switch .led {
  width: 5px; height: 5px; border-radius: 50%;
  background: #2a1d0d;
  box-shadow: inset 0 0 2px rgba(0,0,0,0.8);
}
.nw-switch.active .led {
  background: #ff3b30;
  box-shadow: 0 0 7px 2px rgba(255,59,48,0.9);
}
.nw-switch:hover .housing { border-color: #2a3020; }
.nw-switch:focus-visible .housing { outline: 2px solid var(--amber); outline-offset: 2px; }

.nw-switch .plate {
  margin-top: 2px;
  text-align: center;
  color: var(--bone-dim);
  line-height: 1.25;
}
.nw-switch.active .plate { color: var(--amber); }
.nw-switch .lbl {
  font-family: 'Big Shoulders Stencil', sans-serif;
  letter-spacing: 0.04em;
  font-size: 10px;
  display: block;
}
.nw-switch .sub {
  font-size: 7px;
  opacity: 0.75;
  display: block;
  letter-spacing: 0.03em;
}

.nw-trackdown-input {
  width: 100%;
  background: var(--housing-dark);
  border: 1px solid var(--copper);
  border-radius: 3px;
  color: var(--amber);
  font-family: 'Space Mono', monospace;
  font-size: 11px;
  padding: 8px 10px;
  margin-bottom: 12px;
  outline: none;
}
.nw-trackdown-input::placeholder { color: var(--bone-dim); }

/* Transcript */
.nw-screen {
  background: #070a05;
  border: 1px solid #10140d;
  border-radius: 4px;
  height: 260px;
  overflow-y: auto;
  padding: 12px;
  margin-bottom: 12px;
  font-size: 12px;
  line-height: 1.6;
  position: relative;
}
.nw-screen::before {
  content: '';
  position: absolute; inset: 0;
  background: repeating-linear-gradient(0deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 3px);
  pointer-events: none;
}
.nw-line { margin-bottom: 10px; white-space: pre-wrap; }
.nw-line.you { color: var(--bone); }
.nw-line.you .tag { color: var(--copper); }
.nw-line.them { color: var(--amber); }
.nw-line.them .tag { color: var(--amber); }
.nw-line.sys { color: var(--bone-dim); font-style: italic; font-size: 11px; }
.tag { font-weight: 700; letter-spacing: 0.05em; margin-right: 6px; }

.nw-empty { color: var(--bone-dim); font-size: 11px; font-style: italic; }

/* Input row */
.nw-inputrow { display: flex; gap: 8px; }
.nw-input {
  flex: 1;
  background: var(--housing-dark);
  border: 1px solid #10140d;
  border-radius: 3px;
  color: var(--bone);
  font-family: 'Space Mono', monospace;
  font-size: 12px;
  padding: 10px 12px;
  outline: none;
  resize: none;
}
.nw-input:focus { border-color: var(--amber-dim); }
.nw-send {
  font-family: 'Big Shoulders Stencil', sans-serif;
  letter-spacing: 0.08em;
  background: var(--copper);
  color: #1a1006;
  border: none;
  border-radius: 3px;
  padding: 0 18px;
  font-size: 13px;
  font-weight: 800;
  cursor: pointer;
  transition: all 0.15s;
}
.nw-send:hover:not(:disabled) { background: var(--amber); }
.nw-send:disabled { opacity: 0.4; cursor: not-allowed; }

.nw-footer {
  margin-top: 10px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.nw-status {
  font-size: 9px;
  letter-spacing: 0.1em;
  color: var(--bone-dim);
}
.nw-status.on { color: var(--amber); }
.nw-clear {
  font-size: 9px;
  letter-spacing: 0.08em;
  color: var(--bone-dim);
  background: none;
  border: none;
  text-decoration: underline;
  cursor: pointer;
  font-family: 'Space Mono', monospace;
}
.nw-clear:hover { color: var(--alert); }

.nw-screen::-webkit-scrollbar { width: 6px; }
.nw-screen::-webkit-scrollbar-track { background: transparent; }
.nw-screen::-webkit-scrollbar-thumb { background: var(--amber-dim); border-radius: 3px; }

@media (prefers-reduced-motion: reduce) {
  .nw-bar, .nw-switch .lever, .nw-grille::after { transition: none; }
}
</style>

<div class="nw-root">
  <div class="nw-unit" id="nwUnit">
    <div class="nw-rivet tl"></div><div class="nw-rivet tr"></div>
    <div class="nw-rivet bl"></div><div class="nw-rivet br"></div>

    <div class="nw-plate">ENCAMPMENT COMM SALVAGE UNIT &mdash; MODEL VII</div>
    <div class="nw-title">NEVER LINE</div>
    <div class="nw-subtitle">HAND-WIRED &middot; RUNS ON WHATEVER WE COULD FIND</div>

    <div class="nw-grille" id="nwGrille">
      <div class="nw-bar"></div><div class="nw-bar"></div><div class="nw-bar"></div>
      <div class="nw-bar"></div><div class="nw-bar"></div><div class="nw-bar"></div>
      <div class="nw-bar"></div><div class="nw-bar"></div><div class="nw-bar"></div>
      <div class="nw-bar"></div><div class="nw-bar"></div>
    </div>

    <div class="nw-dial-label">SELECT LINE</div>
    <div class="nw-dial" id="nwDial"></div>

    <input type="text" class="nw-trackdown-input" id="nwTrackTarget" placeholder="name to track down..." style="display:none;" />

    <div class="nw-screen" id="nwScreen">
      <div class="nw-empty">// no signal logged on this line yet. pick up and say something.</div>
    </div>

    <div class="nw-inputrow">
      <textarea class="nw-input" id="nwInput" rows="2" placeholder="key up and speak..."></textarea>
      <button class="nw-send" id="nwSend">SEND</button>
    </div>

    <div class="nw-footer">
      <div class="nw-status" id="nwStatus">LINE IDLE</div>
      <button class="nw-clear" id="nwClear">clear this line's log</button>
    </div>
  </div>
</div>

<script>
(function(){
  // ─────────────────────────────────────────────────────────────
  // Paste the /exec URL of your deployed Apps Script relay below.
  // It looks like:
  //   https://script.google.com/macros/s/AKfycb.....A/exec
  //
  // No API key lives in this file anymore — the relay holds it.
  // That means this page is safe to host publicly on GitHub Pages.
  // ─────────────────────────────────────────────────────────────
  const RELAY_URL = 'https://script.google.com/macros/s/AKfycbwVY-GKC4yZiyskJ0fcxRU6VCkPOMFxFpXDbfoOW1R4xfUQbdF_XN086E3GyvuidwZB/exec';

  // Personas and the world bible now live in the relay, not here.
  // This list only drives the switch panel and the transcript labels.
  const CHANNELS = [
    { id: 'dispatch',   label: 'DISPATCH',    sub: 'CH.1' },
    { id: 'encampment', label: 'ENCAMPMENT',  sub: 'CH.2 — ANY BOY' },
    { id: 'sennoc',     label: 'THE SENNOC',  sub: 'CH.3' },
    { id: 'pirates',    label: 'PIRATE LINE', sub: 'CH.4 — HOSTILE' },
    { id: 'trackdown',  label: 'TRACK DOWN',  sub: 'CH.5 — SEARCH' },
  ];

  let state = {
    channel: null,
    logs: {},
  };

  const dial = document.getElementById('nwDial');
  const screen = document.getElementById('nwScreen');
  const input = document.getElementById('nwInput');
  const sendBtn = document.getElementById('nwSend');
  const statusEl = document.getElementById('nwStatus');
  const grille = document.getElementById('nwGrille');
  const clearBtn = document.getElementById('nwClear');
  const trackInput = document.getElementById('nwTrackTarget');

  CHANNELS.forEach(ch => {
    const btn = document.createElement('button');
    btn.className = 'nw-switch';
    btn.dataset.id = ch.id;
    btn.innerHTML = `
      <span class="led"></span>
      <span class="housing"><span class="lever"></span></span>
      <span class="plate"><span class="lbl">${ch.label}</span><span class="sub">${ch.sub}</span></span>
    `;
    btn.onclick = () => selectChannel(ch.id);
    dial.appendChild(btn);
  });

  function selectChannel(id) {
    if (state.channel === id) {
      // flip the active line back off — all switches down
      state.channel = null;
    } else {
      state.channel = id;
    }
    document.querySelectorAll('.nw-switch').forEach(b => b.classList.toggle('active', b.dataset.id === state.channel));
    trackInput.style.display = state.channel === 'trackdown' ? 'block' : 'none';
    const lineIsUp = !!state.channel;
    input.disabled = !lineIsUp;
    sendBtn.disabled = !lineIsUp;
    input.placeholder = lineIsUp ? 'key up and speak...' : 'no line selected';
    if (!lineIsUp) {
      screen.innerHTML = '<div class="nw-empty">// all lines down. flip a switch to open a channel.</div>';
      statusEl.textContent = 'ALL LINES DOWN';
      statusEl.classList.remove('on');
      return;
    }
    renderLog();
  }

  // ── Transcript storage: plain localStorage, per channel ──
  function loadLog(channelId) {
    if (state.logs[channelId]) return state.logs[channelId];
    let log = [];
    try {
      const raw = localStorage.getItem('nwlog:' + channelId);
      if (raw) log = JSON.parse(raw);
    } catch (e) { log = []; }
    state.logs[channelId] = log;
    return log;
  }

  function saveLog(channelId) {
    try {
      localStorage.setItem('nwlog:' + channelId, JSON.stringify(state.logs[channelId] || []));
    } catch (e) { /* best effort — quota or private mode */ }
  }

  function renderLog() {
    const log = loadLog(state.channel);
    screen.innerHTML = '';
    if (!log.length) {
      screen.innerHTML = '<div class="nw-empty">// no signal logged on this line yet. pick up and say something.</div>';
      return;
    }
    log.forEach(entry => {
      const div = document.createElement('div');
      div.className = 'nw-line ' + entry.role;
      if (entry.role === 'you') {
        div.innerHTML = `<span class="tag">YOU &gt;</span>${escapeHtml(entry.text)}`;
      } else if (entry.role === 'them') {
        div.innerHTML = `<span class="tag">${escapeHtml(entry.label || 'LINE')} &gt;</span>${escapeHtml(entry.text)}`;
      } else {
        div.textContent = entry.text;
      }
      screen.appendChild(div);
    });
    screen.scrollTop = screen.scrollHeight;
  }

  function escapeHtml(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function animateGrille(on) {
    grille.classList.toggle('live', on);
    const bars = grille.querySelectorAll('.nw-bar');
    if (!on) { bars.forEach(b => b.style.height = '4px'); return; }
    let raf;
    function tick() {
      bars.forEach(b => b.style.height = (4 + Math.random() * 30) + 'px');
      raf = requestAnimationFrame(tick);
    }
    tick();
    grille._stop = () => { cancelAnimationFrame(raf); bars.forEach(b => b.style.height = '4px'); };
  }
  function stopGrille() {
    grille.classList.remove('live');
    if (grille._stop) grille._stop();
  }

  async function sendMessage() {
    const text = input.value.trim();
    if (!text) return;

    if (!RELAY_URL || RELAY_URL === 'PASTE_YOUR_RELAY_EXEC_URL_HERE') {
      const log = loadLog(state.channel);
      log.push({ role: 'you', text });
      log.push({ role: 'sys', text: '// no relay wired into this unit yet. deploy the Apps Script relay, then paste its /exec URL into RELAY_URL near the top of this file\'s script.' });
      saveLog(state.channel);
      input.value = '';
      renderLog();
      return;
    }

    const channelDef = CHANNELS.find(c => c.id === state.channel);
    const log = loadLog(state.channel);

    log.push({ role: 'you', text });
    input.value = '';
    renderLog();
    saveLog(state.channel);

    sendBtn.disabled = true;
    statusEl.textContent = 'TRANSMITTING...';
    statusEl.classList.add('on');
    animateGrille(true);

    const target = trackInput.value.trim();

    if (state.channel === 'trackdown') {
      log.push({ role: 'sys', text: `// searching encampment frequencies for "${target || 'unknown contact'}"...` });
      renderLog();
    }

    try {
      const history = log.filter(e => e.role === 'you' || e.role === 'them').slice(-12).map(e => ({
        role: e.role === 'you' ? 'user' : 'model',
        parts: [{ text: e.text }]
      }));

      // Content-Type is text/plain on purpose. Apps Script web apps don't
      // answer CORS preflight requests, and application/json would trigger
      // one. text/plain keeps this a "simple request" so it goes straight
      // through. The relay parses the body as JSON on its side.
      const response = await fetch(RELAY_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          channel: state.channel,
          target: target,
          history: history
        })
      });

      const data = await response.json();

      if (data.error) throw new Error(data.error);

      const reply = (data.reply || '').trim() || '// (empty reply — dead air.)';

      const label = channelDef.label === 'ENCAMPMENT' ? 'UNKNOWN VOICE' :
                    channelDef.label === 'TRACK DOWN' ? (target ? target.toUpperCase() : 'SEARCH') :
                    channelDef.label;
      log.push({ role: 'them', label, text: reply });
    } catch (e) {
      log.push({ role: 'sys', text: `// line dropped: ${e.message || 'unknown error'}` });
    }

    saveLog(state.channel);
    renderLog();
    stopGrille();
    statusEl.textContent = 'LINE IDLE';
    statusEl.classList.remove('on');
    sendBtn.disabled = false;
  }

  sendBtn.onclick = sendMessage;
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  clearBtn.onclick = () => {
    state.logs[state.channel] = [];
    saveLog(state.channel);
    renderLog();
  };

  selectChannel('dispatch');
})();
</script>

</body>
</html>
